<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Buddy on the desktop</title>
<style>
  /* Bubble and research-card text (the setup guide's body font). */
  /* Arabic (Readex Pro): the letters of an Arabic reply, which the system font may lack. */
  @font-face {
    font-family: "Roamies Arabic";
    src: url("onboarding/fonts/readex-pro-arabic.woff2") format("woff2");
    font-weight: 160 700;
    font-display: swap;
    /* Arabic letters only: the Latin side of every stack stays the system font. */
    unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F, U+2010-2011, U+204F;
  }
  @font-face {
    font-family: "Roamies Arabic RTL";
    src: url("onboarding/fonts/readex-pro-arabic.woff2") format("woff2");
    font-weight: 160 700;
    font-display: swap;
    /* The same file, also taking the space and common punctuation: first in the stack of right-to-left text only, so Arabic
       words and their ! . , ? sit a normal distance apart instead of a full monospace cell. */
    unicode-range: U+0020-0021, U+0028-0029, U+002C-002E, U+003A-003B, U+003F, U+00A0, U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F, U+2010-2011, U+204F;
  }
  /* Handwritten text on drawn cards and diagrams, the Excalidraw look (Virgil by Ellinor Rapp, SIL OFL 1.1). Latin only. */
  @font-face {
    font-family: "Buddy Hand";
    src: url("onboarding/fonts/Virgil-Regular.woff2") format("woff2");
    font-display: swap;
    unicode-range: U+0000-024F, U+2000-206F, U+20AC, U+2190-21FF;
  }
/* Headings on drawn cards and tickets. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  /* Sized and moved by core.js to cover just what's drawn. */
  canvas { position: fixed; left: 0; top: 0; display: block; cursor: grab; touch-action: none; transform-origin: 0 0; will-change: transform;
    /* Never selectable: a stray triple-click or Select All tints a selected canvas solid grey over its whole box. */
    -webkit-user-select: none; user-select: none; }
  canvas:active { cursor: grabbing; }
  /* The exam countdown badge (host.js setBadge): a small pill in the bottom-left corner, never in the way of clicks. */
  .exam-badge { position: fixed; left: 18px; bottom: 64px; z-index: 5; pointer-events: none; display: flex; flex-direction: column; gap: 1px;
    padding: 8px 14px 9px; border-radius: 14px; background: rgba(9, 9, 11, .88); color: #fafafa; border: 1px solid rgba(255, 255, 255, .14);
    box-shadow: 0 6px 22px rgba(0, 0, 0, .28); font: 600 13px/1.25 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; }
  .exam-badge b { font-weight: 700; letter-spacing: .01em; }
  .exam-badge span { font-weight: 500; font-size: 11.5px; color: #a1a1aa; }
  .exam-badge[hidden] { display: none; }
  :root[data-theme="light"] .exam-badge { background: rgba(255, 255, 255, .96); color: #09090b; border-color: rgba(0, 0, 0, .12); box-shadow: 0 6px 22px rgba(0, 0, 0, .14); }
  :root[data-theme="light"] .exam-badge span { color: #52525b; }
</style>
</head>
<body>
<canvas id="stage" aria-label="My Buddy on the desktop"></canvas>
<script src="roamies/core.js"></script>
<script src="roamies/markdown.js"></script>
<script src="roamies/sfx.js"></script>
<script src="roamies/voice-out.js"></script>
<script src="roamies/glass.js"></script>
<script src="roamies/minis.js"></script>
<script src="roamies/agent-home.js"></script>
<script src="roamies/agent.js"></script>
<script src="roamies/agent-tools.js"></script>
<script src="roamies/agent-cards.js"></script>
<script src="roamies/agent-panel.js"></script>
<script src="roamies/jarvis.js"></script>
<script src="roamies/cosmo.js"></script>
<script src="roamies/people.js"></script>
<script src="roamies/sprites.js"></script>
<script src="roamies/peri.js"></script>
<script src="roamies/nova.js"></script>
<script src="roamies/sprout.js"></script>
<script src="roamies/10-dither.js"></script>
<script src="roamies/12-sidekick.js"></script>
<script>Roamie.bootDesktop(document.getElementById("stage")); document.fonts.load('500 13px "Roamies Arabic"', 'م'); document.fonts.load('400 13px "Buddy Hand"', 'a'); document.fonts.load('500 13px "Roamies Arabic RTL"', 'م ');</script>
<script src="roamies/ink3d.js"></script>
<script src="roamies/world.js"></script>
<script src="roamies/ink.js"></script>
<script src="roamies/sidebar.js"></script>
<script src="roamies/pen.js"></script>
<script src="roamies/ask-bar.js"></script>
<script src="roamies/notch.js"></script>
<script src="roamies/host.js"></script>
</body>
</html>
