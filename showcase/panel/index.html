<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Buddy — AI Desktop Companion</title>
<link rel="stylesheet" href="../onboarding/onboarding.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="frame shut" id="frame">
<header class="head">
  <!-- Left: the character's face, the name, and a line with its state and model -->
  <div class="head-left">
    <div class="brand-wrap">
      <span class="face-tile"><canvas class="avatar brand-face" id="avatar" aria-hidden="true"></canvas></span>
      <div class="brand-text">
        <h1 id="title">My Buddy</h1>
        <div class="brand-sub">
          <span class="status-live"><span class="led on" id="led" aria-hidden="true"></span><span class="live-label">Live</span></span>
          <span class="dotsep" aria-hidden="true">·</span>
          <span class="model-pill" id="head-model-pill" role="button" tabindex="0" title="Change the AI model"><span class="model-name" id="model-name">AI Ready</span></span>
          <span class="dotsep" aria-hidden="true">·</span>
          <span class="ver" id="ver"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Header Live Avatar Preview & Speech line -->
  <div class="head-center">
    <div class="avatar-meta">
      <p class="saying" id="saying" aria-hidden="true"></p>
      <p class="by" id="by"></p>
      <p class="sr-only" id="now" role="status" aria-live="polite"></p>
    </div>
  </div>

  <!-- Right: updates and Quit, then the window's own buttons (maximise, close) -->
  <div class="head-right">
    <!-- Updates: Check for updates, then Update to x (it installs and restarts), then Done. -->
    <button class="head-btn ghost" type="button" id="head-update" hidden></button>
    <!-- Quit: the first press turns it into Confirm for a few seconds. -->
    <button class="head-btn head-quit arm" type="button" id="head-quit" aria-pressed="false" aria-label="Quit My Buddy"><span class="no" aria-hidden="true">Quit</span><span class="yes" aria-hidden="true">Confirm</span></button>
    <span class="head-sep" aria-hidden="true"></span>
    <!-- Maximise (or back to the size it was): the window can also be dragged by its header and resized by its edges. -->
    <button class="win-btn head-max" type="button" id="head-max" aria-label="Maximise" data-tip="Maximise"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="1.5" width="9" height="9" rx="1.5"/></svg></button>
    <!-- Close (Esc does the same). -->
    <button class="win-btn win-close" type="button" id="head-close" aria-label="Close panel (Esc)" data-tip="Close (Esc)"></button>
  </div>
</header>

<div class="split">
  <!-- One page per concern: what's going on, what it remembers, then a page for each group of settings. -->
  <nav class="side" aria-label="Panel">
    <ul class="nav">
      <li>
        <button class="px navi" type="button" id="nav-home" data-page="home" aria-controls="pane-home" aria-current="page">
          <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span class="nav-label">Overview</span>
          <span class="dot" aria-hidden="true"></span>
        </button>
      </li>
      <li>
        <button class="px navi" type="button" id="nav-memory" data-page="memory" aria-controls="pane-memory">
          <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
          <span class="nav-label">Memory Bank</span>
          <span class="dot" aria-hidden="true"></span>
        </button>
      </li>
      <li>
        <button class="px navi" type="button" id="nav-abilities" data-page="abilities" aria-controls="pane-abilities">
          <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          <span class="nav-label">Abilities & Skills</span>
          <span class="dot" aria-hidden="true"></span>
        </button>
      </li>
      <li>
        <button class="px navi" type="button" id="nav-study" data-page="study" aria-controls="pane-study">
          <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 2.5 9 2.5 12 0v-5"/></svg>
          <span class="nav-label">Study</span>
          <span class="dot" aria-hidden="true"></span>
        </button>
      </li>
      <li>
        <button class="px navi" type="button" id="nav-model" data-page="model" aria-controls="pane-model">
          <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="nav-label">AI Model</span>
          <span class="dot" aria-hidden="true"></span>
        </button>
      </li>
      <li>
        <button class="px navi" type="button" id="nav-appearance" data-page="appearance" aria-controls="pane-appearance">
          <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="nav-label">Companion Persona</span>
          <span class="dot" aria-hidden="true"></span>
        </button>
      </li>
      <li>
        <button class="px navi" type="button" id="nav-speaking" data-page="speaking" aria-controls="pane-speaking">
          <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
          <span class="nav-label">Vocal Synthesis</span>
          <span class="dot" aria-hidden="true"></span>
        </button>
      </li>
      <li>
        <button class="px navi" type="button" id="nav-listening" data-page="listening" aria-controls="pane-listening">
          <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
          <span class="nav-label">Voice & Ears</span>
          <span class="dot" aria-hidden="true"></span>
        </button>
      </li>
      <li>
        <button class="px navi" type="button" id="nav-shortcuts" data-page="shortcuts" aria-controls="pane-shortcuts">
          <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="6" y1="8" x2="6.01" y2="8"/><line x1="10" y1="8" x2="10.01" y2="8"/><line x1="14" y1="8" x2="14.01" y2="8"/><line x1="18" y1="8" x2="18.01" y2="8"/><line x1="6" y1="12" x2="6.01" y2="12"/><line x1="18" y1="12" x2="18.01" y2="12"/><line x1="10" y1="16" x2="14" y2="16"/></svg>
          <span class="nav-label">Keybindings</span>
          <span class="dot" aria-hidden="true"></span>
        </button>
      </li>
      <li>
        <button class="px navi" type="button" id="nav-general" data-page="general" aria-controls="pane-general">
          <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="nav-label">Preferences</span>
          <span class="dot" aria-hidden="true"></span>
        </button>
      </li>
      <li>
        <button class="px navi" type="button" id="nav-about" data-page="about" aria-controls="pane-about">
          <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span class="nav-label">About My Buddy</span>
          <span class="dot" aria-hidden="true"></span>
        </button>
      </li>
      <li>
        <button class="px navi" type="button" id="nav-whatsnew" data-page="whatsnew" aria-controls="pane-whatsnew">
          <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="nav-label">Release Notes</span>
          <span class="dot" aria-hidden="true"></span>
        </button>
      </li>
    </ul>
    
    <div class="side-footer">
      <div class="side-shortcut-hint">Press <kbd>Esc</kbd> anytime to close</div>
    </div>
  </nav>

  <main class="body">
    <div class="pane-container">
      <section class="pane" id="pane-home" aria-labelledby="nav-home"></section>
      <section class="pane" id="pane-memory" aria-labelledby="nav-memory" hidden></section>
      <section class="pane" id="pane-abilities" aria-labelledby="nav-abilities" hidden></section>
      <section class="pane" id="pane-study" aria-labelledby="nav-study" hidden></section>
      <section class="pane" id="pane-model" aria-labelledby="nav-model" hidden></section>
      <section class="pane" id="pane-appearance" aria-labelledby="nav-appearance" hidden></section>
      <section class="pane" id="pane-speaking" aria-labelledby="nav-speaking" hidden></section>
      <section class="pane" id="pane-listening" aria-labelledby="nav-listening" hidden></section>
      <section class="pane" id="pane-shortcuts" aria-labelledby="nav-shortcuts" hidden></section>
      <section class="pane" id="pane-general" aria-labelledby="nav-general" hidden></section>
      <section class="pane" id="pane-about" aria-labelledby="nav-about" hidden></section>
      <section class="pane" id="pane-whatsnew" aria-labelledby="nav-whatsnew" hidden></section>
    </div>
  </main>
</div>

<p class="note" id="note" role="status" aria-live="polite" hidden></p>
<!-- Tooltip: what a choice is for and what it costs. The same text is each option's description for screen readers. -->
<div class="px tip" id="tip" aria-hidden="true" hidden></div>

</div>
<script src="../roamies/core.js"></script>
<script src="../roamies/jarvis.js"></script>
<script src="../roamies/cosmo.js"></script>
<script src="../roamies/people.js"></script>
<script src="../roamies/sprites.js"></script>
<script src="../roamies/peri.js"></script>
<script src="../roamies/nova.js"></script>
<script src="../roamies/sprout.js"></script>
<script src="../roamies/10-dither.js"></script>
<script src="panel.js"></script>
</body>
</html>
